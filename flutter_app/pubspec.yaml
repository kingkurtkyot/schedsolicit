name: schedsolicit
description: "SchedSolicit Owner App - Unified Schedule and Solicitation Management"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0
  dio: ^5.4.3+1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3
  table_calendar: ^3.1.1
  image_picker: ^1.1.1
  google_mlkit_text_recognition: ^0.13.0
  share_plus: ^9.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  excel: ^4.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  image: ^4.2.0
  flutter_slidable: ^3.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  collection: ^1.18.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
